<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Business Card</title>
    <link rel="stylesheet" href="style/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>

<body>
    <div class="container">
        <header>
            <img src="https://github.com/gabrieldagostin.png" alt="Foto de Perfil" class="profile-img">
            <h1>Gabriel Fernandes Dagostin</h1>
            <p class="subtitle">Technology Student | Junior Software Developer</p>
            <div class="skills">
                <span>Java</span>
                <span>Spring-Boot</span>
                <span>PostgresSQL</span>
                <span>Docker</span>
            </div>
        </header>
        <main class="links">

            <a href="#" class="link-card">
                <i class="fa-brands fa-linkedin"></i>
                <span>LinkedIn</span>
            </a>

            <a href="https://github.com/gabrieldagostin" class="link-card">
                <i class="fa-brands fa-github"></i>
                <span>My GitHub</span>
            </a>

            <a href="mailto:gabrielfernandesdagostin@gmail.com" class="link-card">
                <i class="fa-solid fa-envelope"></i>
                <span>Contact by E-mail</span>
            </a>

            <a href="#" class="link-card" onclick="copyEmail()">
                <i class="fa-solid fa-copy"></i>
                <span>Copy E-mail</span>
            </a>

            <a href="cv.pdf" target="_blank" class="link-card">
                <i class="fa-solid fa-file-arrow-down"></i>
                <span>CV (English)</span>
            </a>

            <a href="cv.pdf" target="_blank" class="link-card">
                <i class="fa-solid fa-file-arrow-down"></i>
                <span>Currículo (Português)</span>
            </a>

            <div class="status">
                <span class="dot"></span>
                Available for projects
            </div>
        </main>
        <footer>
            <p>"Blessed are those who mourn, for they will be comforted." <br> (Matthew 5:4, NIV)</p>
        </footer>
    </div>
    <script src="js/script.js"></script>
</body>

</html>
